openapi: 3.1.0
info:
  title: sintaks.dev API
  version: 0.2.0
  description: OpenAI-compatible chat, embeddings, and image generation API for sintaks.dev.
  license:
    name: Proprietary
servers:
  - url: https://api.sintaks.dev
    description: Production gateway
security:
  - bearerAuth: []
tags:
  - name: Chat
  - name: Embeddings
  - name: Images
paths:
  /v1/chat/completions:
    post:
      tags: [Chat]
      summary: Create a chat completion
      description: Create a streaming or non-streaming chat completion. The request shape is compatible with the OpenAI Chat Completions API.
      operationId: createChatCompletion
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
            example:
              model: claude-sonnet-5-5
              messages:
                - role: user
                  content: Hello from sintaks.dev
              stream: false
      responses:
        '200':
          description: Chat completion or server-sent event stream when stream is true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletion'
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientBalance'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
  /v1/embeddings:
    post:
      tags: [Embeddings]
      summary: Create embeddings
      description: Create embedding vectors for text inputs. Compatible with the OpenAI Embeddings API.
      operationId: createEmbedding
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingRequest'
            example:
              model: qwen3-embedding-0-6b
              input: Hello from sintaks.dev
              encoding_format: float
      responses:
        '200':
          description: Embedding vectors in request order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientBalance'
        '501':
          description: Embeddings are not configured for this deployment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
  /v1/images/generations:
    post:
      tags: [Images]
      summary: Generate images
      operationId: generateImages
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageGenerationRequest'
            example:
              model: claude-sonnet-5-5
              prompt: A futuristic Jakarta skyline at dusk
              size: 1024x1024
      responses:
        '200':
          description: Generated image URLs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageGenerationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientBalance'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: Use an API key created in the sintaks.dev portal.
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Optional client request identifier. The gateway returns an X-Request-ID on every response.
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, malformed, revoked, or invalid API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InsufficientBalance:
      description: The IDR balance cannot cover the request reservation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UpstreamUnavailable:
      description: The upstream provider could not complete the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
        messages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ChatMessage'
        stream:
          type: boolean
          default: false
        stream_options:
          type: object
          properties:
            include_usage:
              type: boolean
        max_tokens:
          type: integer
          minimum: 1
        max_completion_tokens:
          type: integer
          minimum: 1
        temperature:
          type: number
        top_p:
          type: number
        n:
          type: integer
          enum: [1]
        stop:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        tools:
          type: array
          description: Function tools relayed to the provider. Streamed and non-streamed responses carry tool_calls like OpenAI.
        functions:
          type: array
          description: Legacy OpenAI function declarations, converted to tools internally.
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, developer, user, assistant, tool]
        content:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                required: [type, text]
                properties:
                  type:
                    type: string
                    enum: [text]
                  text:
                    type: string
        tool_calls:
          type: array
          description: Assistant messages may carry function tool calls.
          items:
            $ref: '#/components/schemas/ChatMessageToolCall'
        tool_call_id:
          type: string
          description: Required on tool-role messages; links the result to the assistant call it answers.
    ChatMessageToolCall:
      type: object
      required: [id, type, function]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [function]
        function:
          type: object
          required: [name, arguments]
          properties:
            name:
              type: string
            arguments:
              type: string
              description: JSON-encoded arguments.
    ChatCompletion:
      type: object
      required: [id, object, created, model, choices]
      properties:
        id:
          type: string
        object:
          type: string
          enum: [chat.completion]
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                $ref: '#/components/schemas/CompletionMessage'
              finish_reason:
                type: string
                nullable: true
        usage:
          $ref: '#/components/schemas/Usage'
    CompletionMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
        content:
          type: string
    Usage:
      type: object
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
    EmbeddingRequest:
      type: object
      required: [model, input]
      properties:
        model:
          type: string
        input:
          oneOf:
            - type: string
            - type: array
              minItems: 1
              items:
                type: string
        encoding_format:
          type: string
          enum: [float]
          default: float
        dimensions:
          type: integer
          minimum: 1
          description: Optional truncated output dimension; providers that cannot truncate reject the request.
    EmbeddingResponse:
      type: object
      required: [object, data, model]
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items:
            $ref: '#/components/schemas/EmbeddingObject'
        model:
          type: string
        usage:
          $ref: '#/components/schemas/EmbeddingUsage'
    EmbeddingObject:
      type: object
      required: [object, index, embedding]
      properties:
        object:
          type: string
          enum: [embedding]
        index:
          type: integer
        embedding:
          type: array
          items:
            type: number
    EmbeddingUsage:
      type: object
      properties:
        prompt_tokens:
          type: integer
        total_tokens:
          type: integer
    ImageGenerationRequest:
      type: object
      required: [prompt]
      properties:
        model:
          type: string
        prompt:
          type: string
        n:
          type: integer
          minimum: 1
        size:
          type: string
          description: auto or WIDTHxHEIGHT, for example 1024x1024.
        response_format:
          type: string
          enum: [url]
    ImageGenerationResponse:
      type: object
      required: [created, data]
      properties:
        created:
          type: integer
        data:
          type: array
          items:
            type: object
            required: [url]
            properties:
              url:
                type: string
                format: uri
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type]
          properties:
            message:
              type: string
            type:
              type: string
            param:
              type: string
              nullable: true
            code:
              type: string
              nullable: true
